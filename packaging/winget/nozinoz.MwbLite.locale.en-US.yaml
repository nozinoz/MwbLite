ShortDescription: One keyboard, mouse and clipboard for all your Windows PCs, based on Mouse Without Borders from PowerToys.
Description: |-
  MwbLite is Mouse Without Borders (MWB) carved out of Microsoft PowerToys so it runs on its own, as a tray app
  with a Settings window. Move the mouse across the edge of one screen onto another PC, type with one keyboard,
  and share the clipboard and files between up to four Windows PCs. PCs are paired with a 6-digit code, and
  connections are encrypted. It has no PowerToys runner, updater or telemetry.
